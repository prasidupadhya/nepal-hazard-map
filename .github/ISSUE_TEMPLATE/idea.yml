name: Idea
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve, and for whom?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations: { required: true }
  - type: textarea
    id: sources
    attributes:
      label: Data or methods it would need
      description: Official sources or published methods, if it shows new numbers.
