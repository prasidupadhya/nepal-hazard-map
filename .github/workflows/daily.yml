name: Copy data
on:
  schedule:
    - cron: '17 0 * * *'   # every day 00:17 UTC = 06:02 Nepal Time
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Copy latest official data
        if: github.event_name != 'push'
        run: node scripts/fetch-data.js
      - name: Build WebAssembly
        run: rustup target add wasm32-unknown-unknown && npm run wasm
      - run: npm test
      - run: npm run build
      # Committing the copy keeps the archive growing; Vercel redeploys on this push.
      - name: Save the copy
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || (git commit -m "Daily data copy $(date -u +%F)" && git push)
