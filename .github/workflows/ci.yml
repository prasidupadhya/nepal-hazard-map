name: CI
# Runs on every pull request and on main. "test" is the required check for merging into main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Build WebAssembly
        run: rustup target add wasm32-unknown-unknown && npm run wasm
      - name: Unit tests (parsers, districts, scenario maths, WASM = JS)
        run: npm test
      - run: npm run build
      - name: Browser checks (both languages, phone and desktop, scenarios, print)
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 60); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node e2e/check.mjs http://localhost:4173/
